# Isolated lab only: reserve the Consumer's 6144 MiB guest boot memory in addition
# to application requests. This is conservative scheduling, not a measured RSS.
# Apply after CoCo creates this RuntimeClass and before creating model Jobs.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu-coco-dev
handler: kata-qemu-coco-dev
overhead:
  podFixed:
    cpu: 250m
    memory: 6Gi
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
